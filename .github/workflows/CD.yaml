name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-to-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials for Dev
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Bootstrap CDK (only if needed)
        run: |
          if ! aws ssm get-parameter --name /cdk-bootstrap/hnb659fds/version --region ap-southeast-2; then
            echo "Bootstrapping CDK environment..."
            npx cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/ap-southeast-2 --require-approval never
          else
            echo "CDK environment already bootstrapped."
          fi

      - name: Deploy to Dev
        run: |
          npm run cdk:deploy -- \
            --require-approval never \
            --parameters UrlTmsCrmApi=${{ vars.TMS_CRM_API_DOMAIN }} \
            --parameters ShouldCreateEC2ForRDSAccess=${{ vars.SHOULD_CREATE_EC2_FOR_RDS_ACCESS }} \

  deploy-to-prod:
    needs: deploy-to-dev
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Print environment variables (Prod)
        run: |
          echo "TMS_CRM_API_DOMAIN=${{ vars.TMS_CRM_API_DOMAIN }}"


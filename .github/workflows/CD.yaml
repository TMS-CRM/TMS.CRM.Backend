name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy-to-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials for Dev
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ap-southeast-2

      # 🏗️ Conditionally bootstrap the CDK environment if not already bootstrapped
      - name: Bootstrap CDK (only if needed)
        run: |
          if ! aws ssm get-parameter --name /cdk-bootstrap/hnb659fds/version --region ap-southeast-2; then
            echo "Bootstrapping CDK environment..."
            npx cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID_DEV }}/ap-southeast-2 --require-approval never
          else
            echo "CDK environment already bootstrapped."
          fi

      - name: Deploy to Dev
        run: npm run cdk:deploy -- --require-approval never
